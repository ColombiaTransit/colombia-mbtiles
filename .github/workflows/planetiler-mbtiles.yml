# This is a basic workflow to help you get started with Actions
on:
  workflow_dispatch: ~
  schedule:
  - cron: 25 5 * * 1

name: planetiler-mbtiles

env:
  AREA: colombia
  REGION: south-america
  RAM: 2g

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  generate:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '14'
      - run: npm install -g strip-ansi-cli@3.0.2
      
      - name: Download PlanetTiler
        run: |
          wget https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar -O planetiler.jar

      - name: Download OSM PBF
        run: |
          mkdir -p data/sources
          curl -L --fail --retry 5 --retry-delay 15 --retry-all-errors \
            -o data/sources/colombia.osm.pbf \
            https://download.geofabrik.de/south-america/colombia-latest.osm.pbf
    
      - name: 'Build MBTiles'
        run: |
          mkdir -p -v data
          java -Xms${{ env.RAM }} -Xmx${{ env.RAM }} -jar planetiler.jar --area="${{ env.AREA }}" --mbtiles=data/colombia.mbtiles --download --minzoom=0 --maxzoom=16 --languages=en,es 2>&1 | tee log
          ls -alh planetiler.jar | tee -a log
          cat log | strip-ansi > data/build-log.txt         

      - name: Verify mbtiles was created
        run: |
          if [ ! -s data/colombia.mbtiles ]; then
            echo "::error::data/colombia.mbtiles is missing or empty — aborting release"
            exit 1
          fi
          echo "mbtiles file present: $(du -h data/colombia.mbtiles | cut -f1)"
      
      - name: Get timestamp for release
        id: timestamp
        env:
          TZ: Europe/Amsterdam
        run: echo "timestamp=$(date +'Planetiles-%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT
        
      - name: Release new graph        
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/main'
        with:
          artifacts: data/colombia.mbtiles,data/build-log.txt
          tag: ${{ steps.timestamp.outputs.timestamp }}
