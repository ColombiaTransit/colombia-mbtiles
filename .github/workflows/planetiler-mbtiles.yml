name: planetiler-mbtiles

on:
  workflow_dispatch: ~
  schedule:
    - cron: 25 5 * * 1

# Nodig om releases aan te maken/bij te werken met GITHUB_TOKEN
permissions:
  contents: write

# Nooit twee builds tegelijk die dezelfde release overschrijven
concurrency:
  group: planetiler-mbtiles
  cancel-in-progress: false

env:
  AREA: colombia
  REGION: south-america
  RAM: 4g
  # OpenMapTiles-standaard; clients en tileserver-gl overzoomen vanaf 14
  MAXZOOM: 14
  # Vaste tag die altijd naar de nieuwste build wijst
  LATEST_TAG: planetiler-latest

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Download Planetiler
        run: |
          curl -L --fail --retry 5 --retry-delay 15 -o planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Download OSM PBF
        run: |
          mkdir -p data/sources
          curl -L --fail --retry 5 --retry-delay 15 --retry-all-errors \
            -o data/sources/${AREA}.osm.pbf \
            https://download.geofabrik.de/${REGION}/${AREA}-latest.osm.pbf

      - name: Build MBTiles
        run: |
          set -o pipefail
          java -Xms${RAM} -Xmx${RAM} -jar planetiler.jar \
            --area="${AREA}" \
            --output=data/${AREA}.mbtiles \
            --download \
            --http-retries=5 --http-timeout=120s \
            --minzoom=0 --maxzoom=${MAXZOOM} \
            --languages=en,es \
            --force \
            2>&1 | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee data/build-log.txt

      - name: Verify and checksum
        id: meta
        run: |
          f=data/${AREA}.mbtiles
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty — aborting release"
            exit 1
          fi
          # Integriteitscheck van de SQLite-database
          sqlite3 "$f" "PRAGMA quick_check;" | grep -qx ok
          tiles=$(sqlite3 "$f" "SELECT count(*) FROM tiles;")
          [ "$tiles" -gt 0 ] || { echo "::error::no tiles in $f"; exit 1; }

          (cd data && sha256sum ${AREA}.mbtiles > ${AREA}.mbtiles.sha256)

          echo "size=$(du -h "$f" | cut -f1)" >> $GITHUB_OUTPUT
          echo "tiles=$tiles" >> $GITHUB_OUTPUT
          echo "osm_date=$(curl -sL https://download.geofabrik.de/${REGION}/${AREA}-updates/state.txt | sed -n 's/^timestamp=//p' | sed 's/\\//g')" >> $GITHUB_OUTPUT
          echo "built=$(TZ=Europe/Amsterdam date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.LATEST_TAG }}
          name: Colombia MBTiles (Planetiler, latest)
          commit: ${{ github.sha }}
          body: |
            OpenMapTiles-schema vector tiles voor Colombia, gebouwd met Planetiler.

            - Gebouwd: ${{ steps.meta.outputs.built }} (Europe/Amsterdam)
            - OSM-data: ${{ steps.meta.outputs.osm_date }}
            - Zoom: 0–${{ env.MAXZOOM }}
            - Grootte: ${{ steps.meta.outputs.size }}, ${{ steps.meta.outputs.tiles }} tiles

            Vaste download-URL:
            https://github.com/${{ github.repository }}/releases/download/${{ env.LATEST_TAG }}/${{ env.AREA }}.mbtiles
          artifacts: data/${{ env.AREA }}.mbtiles,data/${{ env.AREA }}.mbtiles.sha256,data/build-log.txt
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
