name: planetiler-mbtiles

on:
  workflow_dispatch: ~
  schedule:
    - cron: 25 5 * * 1

# Nodig om releases aan te maken/bij te werken met GITHUB_TOKEN
permissions:
  contents: write

# Nooit twee builds tegelijk die dezelfde release overschrijven
concurrency:
  group: planetiler-mbtiles
  cancel-in-progress: false

env:
  AREA: colombia
  REGION: south-america
  RAM: 4g
  # OpenMapTiles-standaard; clients en tileserver-gl overzoomen vanaf 14
  MAXZOOM: 14
  # Vaste tag die altijd naar de nieuwste build wijst
  LATEST_TAG: planetiler-latest
  # Water polygons: eigen mirror omdat osmdata.openstreetmap.de vaak plat ligt
  WP_FILE: water-polygons-split-3857.zip
  WP_MIRROR_TAG: sources-mirror

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Download Planetiler
        run: |
          curl -L --fail --retry 5 --retry-delay 15 -o planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Download OSM PBF
        run: |
          mkdir -p data/sources
          f=data/sources/${AREA}.osm.pbf
          # Eén poging per server: lees de status en ga bij een fout direct
          # door naar de volgende mirror in plaats van te blijven proberen.
          for url in \
            https://download.geofabrik.de/${REGION}/${AREA}-latest.osm.pbf \
            https://download.openstreetmap.fr/extracts/${REGION}/${AREA}-latest.osm.pbf
          do
            code=$(curl -sSL --connect-timeout 20 -o "$f" -w '%{http_code}' "$url") || rc=$?
            if [ "${rc:-0}" -eq 0 ] && [ "$code" = "200" ] && [ -s "$f" ]; then
              echo "PBF gedownload van $url"
              exit 0
            fi
            echo "::warning::$url gaf HTTP ${code:-000} (curl exit ${rc:-0}), volgende mirror"
            rm -f "$f"; unset rc
          done
          echo "::error::Geen PBF kunnen downloaden"
          exit 1

      # --- Water polygons ---------------------------------------------------
      # osmdata.openstreetmap.de is regelmatig onbereikbaar. Volgorde:
      #   1. Actions-cache van deze maand  -> klaar
      #   2. Vers van osmdata              -> cache + mirror bijwerken
      #   3. Oudere cache                  -> gebruiken
      #   4. Eigen mirror (release-asset)  -> gebruiken
      # Planetiler slaat bestaande bronbestanden over, dus doet zelf geen
      # verzoek meer naar osmdata zodra het bestand er ligt.
      - name: Month key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> $GITHUB_OUTPUT

      - name: Restore water polygons cache
        id: wp-cache
        uses: actions/cache/restore@v4
        with:
          path: data/sources/${{ env.WP_FILE }}
          key: water-polygons-${{ steps.month.outputs.month }}
          restore-keys: water-polygons-

      - name: Fetch water polygons
        id: wp
        if: steps.wp-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=data/sources/${WP_FILE}
          mkdir -p data/sources
          if curl -fL --connect-timeout 30 --max-time 1800 \
                  --retry 3 --retry-delay 30 --retry-all-errors \
                  -o "$f.tmp" "https://osmdata.openstreetmap.de/download/${WP_FILE}" \
             && unzip -tq "$f.tmp" >/dev/null; then
            mv -f "$f.tmp" "$f"
            echo "Vers gedownload van osmdata.openstreetmap.de"
            echo "fresh=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          rm -f "$f.tmp"
          echo "::warning::osmdata.openstreetmap.de onbereikbaar"
          if [ -s "$f" ]; then
            echo "Oudere versie uit de cache gebruikt"
            exit 0
          fi
          echo "Mirror gebruikt (release ${WP_MIRROR_TAG})"
          gh release download "${WP_MIRROR_TAG}" -R "${GITHUB_REPOSITORY}" \
            -p "${WP_FILE}" -D data/sources --clobber
          unzip -tq "$f" >/dev/null

      - name: Save water polygons cache
        if: steps.wp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/sources/${{ env.WP_FILE }}
          key: water-polygons-${{ steps.month.outputs.month }}

      - name: Update water polygons mirror
        if: steps.wp.outputs.fresh == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${WP_MIRROR_TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${WP_MIRROR_TAG}" -R "${GITHUB_REPOSITORY}" \
              --title "Mirror: water polygons (osmdata.openstreetmap.de)" \
              --notes "Kopie van ${WP_FILE} van https://osmdata.openstreetmap.de/ (ODbL, © OpenStreetMap-bijdragers). Fallback voor de Planetiler-build." \
              --latest=false
          gh release upload "${WP_MIRROR_TAG}" -R "${GITHUB_REPOSITORY}" \
            "data/sources/${WP_FILE}" --clobber

      - name: Build MBTiles
        run: |
          set -o pipefail
          java -Xms${RAM} -Xmx${RAM} -jar planetiler.jar \
            --area="${AREA}" \
            --osm_path=data/sources/${AREA}.osm.pbf \
            --osm_url=https://download.geofabrik.de/${REGION}/${AREA}-latest.osm.pbf \
            --output=data/${AREA}.mbtiles \
            --download \
            --http-retries=5 --http-timeout=120s \
            --minzoom=0 --maxzoom=${MAXZOOM} \
            --languages=en,es \
            --force \
            2>&1 | sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' | tee data/build-log.txt

      - name: Verify and checksum
        id: meta
        run: |
          f=data/${AREA}.mbtiles
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty — aborting release"
            exit 1
          fi
          # Integriteitscheck van de SQLite-database
          sqlite3 "$f" "PRAGMA quick_check;" | grep -qx ok
          tiles=$(sqlite3 "$f" "SELECT count(*) FROM tiles;")
          [ "$tiles" -gt 0 ] || { echo "::error::no tiles in $f"; exit 1; }

          (cd data && sha256sum ${AREA}.mbtiles > ${AREA}.mbtiles.sha256)

          echo "size=$(du -h "$f" | cut -f1)" >> $GITHUB_OUTPUT
          echo "tiles=$tiles" >> $GITHUB_OUTPUT
          echo "osm_date=$(curl -sL https://download.geofabrik.de/${REGION}/${AREA}-updates/state.txt | sed -n 's/^timestamp=//p' | sed 's/\\//g')" >> $GITHUB_OUTPUT
          echo "built=$(TZ=Europe/Amsterdam date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT: ${{ steps.meta.outputs.built }}
          OSM_DATE: ${{ steps.meta.outputs.osm_date }}
          SIZE: ${{ steps.meta.outputs.size }}
          TILES: ${{ steps.meta.outputs.tiles }}
        run: |
          cat > notes.md <<EOF
          OpenMapTiles-schema vector tiles voor Colombia, gebouwd met Planetiler.

          - Gebouwd: ${BUILT} (Europe/Amsterdam)
          - OSM-data: ${OSM_DATE}
          - Zoom: 0–${MAXZOOM}
          - Grootte: ${SIZE}, ${TILES} tiles

          Vaste download-URL:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${AREA}.mbtiles
          EOF

          if gh release view "${LATEST_TAG}" >/dev/null 2>&1; then
            gh release edit "${LATEST_TAG}" --notes-file notes.md --latest
          else
            gh release create "${LATEST_TAG}" --target "${GITHUB_SHA}" \
              --title "Colombia MBTiles (Planetiler, latest)" \
              --notes-file notes.md --latest
          fi
          gh release upload "${LATEST_TAG}" --clobber \
            data/${AREA}.mbtiles data/${AREA}.mbtiles.sha256 data/build-log.txt
